<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183c32">
  <title>Школа № 10 — 80 лет вместе</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20372f;
      --forest: #183c32;
      --forest-deep: #102b24;
      --gold: #d7b878;
      --paper: #f8f2e7;
      --paper-shadow: #e8dfd0;
      --muted: #788078;
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 46%, rgba(245, 232, 198, .18), transparent 44%),
        radial-gradient(ellipse at 50% 100%, #25473a 0, #18372e 48%, #102a24 100%);
      font-family: var(--sans);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.12' filter='url(%23n)'/%3E%3C/svg%3E");
      content: "";
      opacity: .16;
      pointer-events: none;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .stage {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 34px 22px 24px;
    }

    .topline {
      display: flex;
      width: min(1050px, 100%);
      align-items: center;
      justify-content: flex-end;
      margin-bottom: clamp(24px, 5vh, 52px);
      color: rgba(248, 242, 231, .7);
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .settings-wrap { position: relative; z-index: 10; }
    .settings-toggle {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid rgba(248, 242, 231, .2);
      border-radius: 50%;
      color: rgba(248, 242, 231, .72);
      background: rgba(255, 255, 255, .035);
      cursor: pointer;
      transition: border-color .2s, color .2s, background .2s;
    }
    .settings-toggle:hover, .settings-toggle[aria-expanded="true"] {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(255, 255, 255, .08);
    }

    .settings-panel {
      position: absolute;
      top: 48px;
      right: 0;
      width: min(290px, calc(100vw - 42px));
      padding: 20px;
      border: 1px solid rgba(215, 184, 120, .25);
      border-radius: 12px;
      color: #f8f2e7;
      background: #19382f;
      box-shadow: 0 18px 50px #081c17a8;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: opacity .2s, transform .2s;
    }
    .settings-panel.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .settings-title {
      margin: 0 0 16px;
      color: var(--gold);
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 400;
    }
    .setting { margin-top: 15px; }
    .setting-head { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
    .setting-value { color: var(--gold); white-space: nowrap; }
    .setting input[type="range"] {
      width: 100%;
      height: 3px;
      margin: 12px 0 0;
      accent-color: var(--gold);
      cursor: pointer;
    }
    .auto-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; cursor: pointer; }
    .auto-row input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }
    .auto-switch {
      position: relative;
      flex: 0 0 auto;
      width: 38px;
      height: 22px;
      border: 1px solid rgba(248, 242, 231, .28);
      border-radius: 999px;
      background: rgba(0, 0, 0, .2);
      transition: background .2s, border-color .2s;
    }
    .auto-switch::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f8f2e7;
      content: "";
      transition: transform .2s;
    }
    .auto-row input:checked + .auto-switch { border-color: var(--gold); background: #8c7443; }
    .auto-row input:checked + .auto-switch::after { transform: translateX(16px); }
    .auto-row input:focus-visible + .auto-switch { outline: 2px solid var(--gold); outline-offset: 3px; }
    .setting-note { margin: 12px 0 0; color: rgba(248, 242, 231, .52); font-size: 10px; line-height: 1.5; }

    .book-wrap {
      position: relative;
      width: min(980px, 94vw);
      perspective: 1800px;
      perspective-origin: 50% 50%;
    }

    .book {
      position: relative;
      width: 100%;
      aspect-ratio: 1.58 / 1;
      transform-style: preserve-3d;
      box-shadow: 0 26px 26px rgba(0, 0, 0, .3);
    }
    .book::before {
      position: absolute;
      z-index: -1;
      inset: 5px -5px -11px 8px;
      border-radius: 3px 10px 11px 4px;
      background:
        linear-gradient(90deg, #d9cbb4 0 1px, #faf5ea 1px 3px, #d8cbb7 3px 4px, #f8f2e7 4px 6px, #d8cbb7 6px 7px, #f8f2e7 7px),
        repeating-linear-gradient(0deg, #d6c9b3 0 1px, #fbf6ec 1px 3px);
      box-shadow: 3px 5px 0 #59402e, 6px 9px 0 #34291e, 12px 17px 24px rgba(0, 0, 0, .3);
      content: "";
      transform: translateZ(-8px);
    }
    .book::after {
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 0;
      width: 16px;
      border-radius: 5px 0 0 5px;
      background: linear-gradient(90deg, #10271f, #28513d 36%, #d7b878 44%, #173a2e 54%, #10291f);
      box-shadow: 2px 0 5px rgba(0, 0, 0, .28);
      content: "";
      pointer-events: none;
    }

    .spread {
      position: absolute;
      inset: 0 5px 5px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      isolation: isolate;
      border-radius: 4px 10px 10px 4px;
      background: var(--paper);
      box-shadow: inset 0 0 0 1px rgba(98, 75, 43, .14);
      opacity: 0;
      transition: opacity .35s;
    }
    .book.is-open .spread { opacity: 1; }
    .spread::after {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 30px;
      background: linear-gradient(90deg, rgba(80, 57, 34, .1), rgba(255,255,255,.2) 45%, rgba(80,57,34,.07));
      content: "";
      transform: translateX(-50%);
      pointer-events: none;
    }

    .page {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      padding: clamp(25px, 5.2vw, 72px);
      background:
        linear-gradient(90deg, rgba(255,255,255,.5), transparent 12%, transparent 90%, rgba(115,86,49,.035)),
        var(--paper);
    }
    .page-left { padding-right: clamp(32px, 6vw, 82px); }
    .page-right { padding-left: clamp(32px, 6vw, 82px); }

    .turning-sheet {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      transform-origin: left center;
      will-change: transform;
      box-shadow: 0 1px 3px rgba(40, 29, 17, .14);
      opacity: 1;
      pointer-events: none;
    }
    .turning-sheet.turn-forward { animation: turn-forward 1.1s cubic-bezier(.42, 0, .22, 1) forwards; }
    .turning-sheet.turn-backward { left: 0; transform-origin: right center; animation: turn-backward 1.1s cubic-bezier(.42, 0, .22, 1) forwards; }
    .turning-face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform-style: preserve-3d;
    }
    .turning-face.front {
      padding-right: clamp(25px, 5.2vw, 72px);
      padding-left: clamp(32px, 6vw, 82px);
    }
    .turning-face.back {
      padding-left: clamp(25px, 5.2vw, 72px);
      padding-right: clamp(32px, 6vw, 82px);
      background:
        linear-gradient(90deg, rgba(115,86,49,.035), transparent 12%, transparent 90%, rgba(255,255,255,.5)),
        var(--paper);
      transform: rotateY(180deg);
    }
    .turn-backward .turning-face.front {
      padding-right: clamp(32px, 6vw, 82px);
      padding-left: clamp(25px, 5.2vw, 72px);
    }
    .turn-backward .turning-face.back {
      padding-right: clamp(25px, 5.2vw, 72px);
      padding-left: clamp(32px, 6vw, 82px);
    }
    .turn-forward .turning-face.front .page-number,
    .turn-backward .turning-face.back .page-number {
      right: clamp(25px, 4vw, 53px);
      left: auto;
    }
    .turn-forward .turning-face.back .page-number,
    .turn-backward .turning-face.front .page-number {
      right: auto;
      left: clamp(25px, 4vw, 53px);
    }
    @keyframes turn-forward {
      0% { transform: rotateY(0); }
      100% { transform: rotateY(-180deg); }
    }
    @keyframes turn-backward {
      0% { transform: rotateY(0); }
      100% { transform: rotateY(180deg); }
    }

    .page-content {
      position: static;
      z-index: 1;
    }

    .eyebrow {
      display: block;
      margin-bottom: 14px;
      color: #9c7d42;
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .page h1, .page h2 {
      margin: 0 0 16px;
      color: var(--forest);
      font-family: var(--serif);
      font-weight: 400;
      line-height: 1.08;
    }
    .page h1 { font-size: clamp(27px, 4vw, 48px); }
    .page h2 { font-size: clamp(23px, 3.2vw, 36px); }
    .page p {
      max-width: 390px;
      margin: 0 0 13px;
      color: #59645b;
      font-size: clamp(11px, 1.25vw, 15px);
      line-height: 1.8;
    }
    .page .lead { color: #394c40; font-family: var(--serif); font-size: clamp(14px, 1.7vw, 20px); line-height: 1.55; }
    .page-number {
      position: absolute;
      bottom: 19px;
      color: #a39884;
      font-family: var(--serif);
      font-size: 11px;
    }
    .page-left .page-number { right: auto; left: clamp(25px, 4vw, 53px); }
    .page-right .page-number { right: clamp(25px, 4vw, 53px); left: auto; }

    .ornament {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      color: #bd9a57;
      font-size: 13px;
    }
    .ornament::before, .ornament::after { width: 34px; height: 1px; background: #d9c8a7; content: ""; }

    .timeline { display: grid; gap: 14px; margin-top: 22px; }
    .timeline-item { display: grid; grid-template-columns: 62px 1fr; gap: 12px; align-items: start; }
    .timeline-year { color: #a17e3e; font-family: var(--serif); font-size: 17px; }
    .timeline-item p { margin: 1px 0 0; font-size: clamp(10px, 1.1vw, 13px); line-height: 1.55; }

    .photo-frame {
      position: relative;
      width: min(100%, 300px);
      margin: 0 auto 15px;
      padding: 9px;
      background: #fffdf8;
      box-shadow: 0 8px 22px rgba(52, 43, 26, .16);
      transform: rotate(-2deg);
    }
    .photo-frame img { display: block; width: 100%; max-height: 300px; object-fit: cover; }
    .caption { color: #858071; font-family: var(--serif); font-size: 12px; font-style: italic; text-align: center; }

    .cover {
      position: absolute;
      z-index: 3;
      inset: 0;
      overflow: hidden;
      border: 1px solid rgba(226, 198, 137, .65);
      border-radius: 4px 10px 10px 4px;
      color: #f9f0dc;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(48, 94, 72, .62), transparent 57%),
        linear-gradient(135deg, #1d493a, #123328 75%);
      box-shadow: inset 0 0 0 8px #183d31, inset 0 0 0 9px rgba(215, 184, 120, .72), inset 0 0 0 14px #183d31, inset 0 0 0 15px rgba(215, 184, 120, .19);
      cursor: pointer;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(.68, -.05, .25, 1), visibility 1.2s;
      backface-visibility: hidden;
    }
    .cover::before, .cover::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 58%;
      aspect-ratio: 1;
      border: 1px solid rgba(215, 184, 120, .3);
      border-radius: 50%;
      content: "";
      transform: translate(-50%, -50%);
    }
    .cover::after { width: 68%; border-color: rgba(215, 184, 120, .13); }
    .cover-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 35px;
      text-align: center;
    }
    .cover-mark {
      display: grid;
      width: clamp(48px, 7vw, 74px);
      aspect-ratio: 1;
      place-items: center;
      margin-bottom: clamp(12px, 2.4vw, 23px);
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-family: var(--serif);
      font-size: clamp(20px, 3vw, 31px);
    }
    .cover-kicker { color: #ddc895; font-size: clamp(8px, 1vw, 11px); letter-spacing: .3em; text-transform: uppercase; }
    .cover h1 {
      margin: 12px 0 0;
      color: #fff8e9;
      font-family: var(--serif);
      font-size: clamp(32px, 6vw, 68px);
      font-weight: 400;
      letter-spacing: .025em;
      line-height: 1;
    }
    .cover h1 span { display: block; margin-top: 8px; color: var(--gold); font-size: .43em; letter-spacing: .18em; }
    .cover-rule { width: 46px; height: 1px; margin: clamp(14px, 2.4vw, 24px) 0; background: var(--gold); }
    .cover-years { color: rgba(249, 240, 220, .85); font-family: var(--serif); font-size: clamp(13px, 1.7vw, 19px); letter-spacing: .12em; }
    .cover-prompt {
      position: absolute;
      bottom: clamp(20px, 4vw, 38px);
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(249, 240, 220, .68);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      animation: breathe 2.5s ease-in-out infinite;
    }
    @keyframes breathe { 50% { opacity: .45; } }
    .book.is-open .cover { visibility: hidden; transform: rotateY(-166deg); }
    .book-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 25px;
      color: rgba(248, 242, 231, .65);
    }
    .nav-button {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid rgba(248, 242, 231, .25);
      border-radius: 50%;
      color: #f8f2e7;
      background: transparent;
      cursor: pointer;
      transition: border-color .2s, color .2s, transform .2s;
    }
    .nav-button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); transform: scale(1.06); }
    .nav-button:disabled { opacity: .3; cursor: default; }
    .page-status { min-width: 94px; font-size: 10px; letter-spacing: .13em; text-align: center; text-transform: uppercase; }
    @media (max-width: 620px) {
      .stage { min-height: 100svh; justify-content: center; padding: 20px 14px 18px; }
      .topline { margin-bottom: 32px; font-size: 8px; }
      .book-wrap { width: min(94vw, 490px); }
      .book { aspect-ratio: .74 / 1; }
      .spread { inset: 0 5px 5px 12px; grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; border-radius: 4px 9px 9px 4px; }
      .spread::after { top: 50%; right: 0; bottom: auto; left: 0; width: auto; height: 20px; background: linear-gradient(180deg, rgba(80,57,34,.1), rgba(255,255,255,.18) 45%, rgba(80,57,34,.06)); transform: translateY(-50%); }
      .page { padding: 23px 34px; }
      .page-left, .page-right { padding: 23px 34px; }
      .page-left .page-number { bottom: auto; top: 9px; right: 15px; left: auto; }
      .page-right .page-number { right: 15px; bottom: 8px; left: auto; }
      .turn-forward .turning-face.front .page-number,
      .turn-backward .turning-face.front .page-number { top: 9px; right: 15px; bottom: auto; left: auto; }
      .turn-forward .turning-face.back .page-number,
      .turn-backward .turning-face.back .page-number { top: auto; right: 15px; bottom: 8px; left: auto; }
      .turning-sheet { top: 50%; left: 0; width: 100%; height: 50%; transform-origin: center top; }
      .turning-sheet.turn-forward { animation: turn-forward-mobile 1.1s cubic-bezier(.42, 0, .22, 1) forwards; }
      .turning-sheet.turn-backward { top: 0; left: 0; transform-origin: center bottom; animation: turn-backward-mobile 1.1s cubic-bezier(.42, 0, .22, 1) forwards; }
      .turning-face.front, .turning-face.back,
      .turn-backward .turning-face.front, .turn-backward .turning-face.back { padding: 23px 34px; }
      @keyframes turn-forward-mobile {
        0% { transform: rotateX(0); }
        100% { transform: rotateX(180deg); }
      }
      @keyframes turn-backward-mobile {
        0% { transform: rotateX(0); }
        100% { transform: rotateX(-180deg); }
      }
      .page h1 { margin-bottom: 9px; font-size: clamp(22px, 7vw, 32px); }
      .page h2 { margin-bottom: 8px; font-size: clamp(20px, 6vw, 28px); }
      .page p { margin-bottom: 7px; font-size: clamp(9px, 2.8vw, 12px); line-height: 1.55; }
      .page .lead { font-size: clamp(12px, 3.4vw, 16px); }
      .eyebrow { margin-bottom: 8px; font-size: 8px; }
      .ornament { margin: 10px 0; }
      .timeline { gap: 7px; margin-top: 10px; }
      .timeline-item { grid-template-columns: 52px 1fr; gap: 8px; }
      .timeline-year { font-size: 12px; }
      .timeline-item p { font-size: 9px; }
      .photo-frame { width: min(48%, 150px); margin-bottom: 8px; padding: 5px; }
      .photo-frame img { max-height: 125px; }
      .caption { font-size: 9px; }
      .cover-inner { padding: 22px; }
      .cover-mark { width: 43px; margin-bottom: 10px; font-size: 20px; }
      .cover h1 { font-size: clamp(34px, 11vw, 51px); }
      .cover-rule { margin: 13px 0; }
      .cover-prompt { bottom: 19px; font-size: 8px; }
      .book-controls { margin-top: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <header class="topline">
      <div class="settings-wrap">
        <button class="settings-toggle" id="settingsToggle" type="button" aria-label="Настройки перелистывания" aria-expanded="false" aria-controls="settingsPanel">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" stroke="currentColor" stroke-width="1.5"/>
            <path d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3H3.7a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
        </button>
        <section class="settings-panel" id="settingsPanel" aria-label="Настройки книги">
          <h2 class="settings-title">Ритм этой книги</h2>
          <label class="auto-row"><span>Автоматически перелистывать</span><input id="autoFlip" type="checkbox" role="switch" aria-label="Автоматически перелистывать"><span class="auto-switch" aria-hidden="true"></span></label>
          <div class="setting">
            <div class="setting-head"><label for="interval">Время на страницу</label><span class="setting-value" id="intervalValue">8 сек</span></div>
            <input id="interval" type="range" min="4" max="20" value="8">
          </div>
          <div class="setting">
            <div class="setting-head"><label for="randomness">Случайность</label><span class="setting-value" id="randomnessValue">25%</span></div>
            <input id="randomness" type="range" min="0" max="100" value="25">
          </div>
          <p class="setting-note" id="settingNote">Автоперелистывание выключено.</p>
        </section>
      </div>
    </header>

    <div class="book-wrap">
      <div class="book" id="book" aria-label="Юбилейная книга школы № 10">
        <div class="spread" aria-live="polite">
          <article class="page page-left"><div class="page-content" id="leftPage"></div></article>
          <article class="page page-right"><div class="page-content" id="rightPage"></div></article>
          <div class="turning-sheet" id="turningSheet" hidden aria-hidden="true">
            <div class="page turning-face front"><div class="page-content" id="turnFront"></div></div>
            <div class="page turning-face back"><div class="page-content" id="turnBack"></div></div>
          </div>
        </div>
        <button class="cover" id="cover" type="button" aria-label="Открыть юбилейную книгу">
          <span class="cover-inner">
            <span class="cover-mark">✳</span>
            <span class="cover-kicker">Юбилейное издание</span>
            <h1>Школа № 10<span>80 лет вместе</span></h1>
            <span class="cover-rule"></span>
            <span class="cover-years">1946 — 2026</span>
            <span class="cover-prompt">Нажмите, чтобы открыть <span aria-hidden="true">→</span></span>
          </span>
        </button>
      </div>
    </div>

    <nav class="book-controls" aria-label="Перелистывание страниц">
      <button class="nav-button" id="prevButton" type="button" aria-label="Предыдущие страницы" disabled>←</button>
      <span class="page-status" id="pageStatus">Обложка</span>
      <button class="nav-button" id="nextButton" type="button" aria-label="Следующие страницы">→</button>
    </nav>
  </main>

  <script>
    const pages = [
      {
        left: `<span class="eyebrow">С добрым юбилеем</span><h1>Дорогие друзья!</h1><p class="lead">Сегодня мы открываем не просто книгу, а целую историю — историю нашей любимой школы.</p><span class="ornament">✳</span><p>В ней — тысячи улыбок, первые победы, верные друзья и учителя, которые всегда верили в нас.</p>`,
        right: `<span class="eyebrow">Восемь десятилетий</span><h2>80 лет — это только начало</h2><p>Поколения учеников приходили сюда за знаниями, находили призвание и уносили с собой самое важное — тепло школьных лет.</p><div class="timeline"><div class="timeline-item"><span class="timeline-year">1946</span><p>Началась история школы № 10.</p></div><div class="timeline-item"><span class="timeline-year">Сегодня</span><p>Новые мечты, открытия и большие планы.</p></div><div class="timeline-item"><span class="timeline-year">Впереди</span><p>Ещё много счастливых страниц!</p></div></div>`
      },
      {
        left: `<span class="eyebrow">Спасибо вам</span><h2>Тем, кто учит и вдохновляет</h2><p class="lead">Учителя помогают увидеть в себе больше, чем ты сам ожидал.</p><span class="ornament">✳</span><p>Спасибо за терпение, мудрость, поддержку и за то, что каждый день вы открываете для нас новые горизонты.</p>`,
        right: `<span class="eyebrow">Наш общий дом</span><h2>Тем, кто учится и мечтает</h2><p>Пусть школьные коридоры всегда будут наполнены смехом, добрыми встречами и смелыми идеями.</p><p>Пусть каждый ученик найдёт здесь друзей, любимое дело и повод гордиться собой.</p><span class="ornament">✳</span><p class="lead">Ведь школа — это люди. И все мы — её история.</p>`
      },
      {
        left: `<span class="eyebrow">Немного нашего настроения</span><h2>Улыбка юбиляра</h2><div class="photo-frame"><img src="school-portrait.png" alt="Весёлый рисунок для юбилейной книги" loading="eager"></div><div class="caption">Пусть в школе всегда будет место улыбкам</div>`,
        right: `<span class="eyebrow">С праздником, школа!</span><h2>Пусть впереди будет светло</h2><p>Желаем нашей школе процветания, талантливых учеников, вдохновлённых педагогов и радости от каждого нового дня.</p><span class="ornament">✳</span><p class="lead">С юбилеем! Пусть следующие страницы будут ещё ярче.</p><p>С благодарностью и любовью — ученики, выпускники, учителя и родители.</p>`
      }
    ];

    const book = document.getElementById("book");
    const cover = document.getElementById("cover");
    const leftPage = document.getElementById("leftPage");
    const rightPage = document.getElementById("rightPage");
    const turningSheet = document.getElementById("turningSheet");
    const turnFront = document.getElementById("turnFront");
    const turnBack = document.getElementById("turnBack");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const pageStatus = document.getElementById("pageStatus");
    const settingsToggle = document.getElementById("settingsToggle");
    const settingsPanel = document.getElementById("settingsPanel");
    const autoFlip = document.getElementById("autoFlip");
    const settingNote = document.getElementById("settingNote");
    const interval = document.getElementById("interval");
    const randomness = document.getElementById("randomness");
    let spreadIndex = -1;
    let flipTimer;
    let isTurning = false;

    function pageMarkup(index, side) {
      return pages[index][side] + `<span class="page-number">${index * 2 + (side === "left" ? 1 : 2)}</span>`;
    }

    function renderSpread() {
      const spread = pages[spreadIndex];
      if (!spread) return;
      leftPage.innerHTML = pageMarkup(spreadIndex, "left");
      rightPage.innerHTML = pageMarkup(spreadIndex, "right");
      updateNavigation();
    }

    function updateNavigation() {
      pageStatus.textContent = `Страницы ${spreadIndex * 2 + 1}–${spreadIndex * 2 + 2}`;
      prevButton.disabled = spreadIndex === 0;
      nextButton.disabled = false;
    }

    function scheduleFlip() {
      window.clearTimeout(flipTimer);
      if (!autoFlip.checked || spreadIndex < 0 || isTurning) return;
      const base = Number(interval.value) * 1000;
      const variation = Number(randomness.value) / 100;
      const factor = 1 + (Math.random() * 2 - 1) * variation;
      flipTimer = window.setTimeout(() => changeSpread(1), Math.max(2000, base * factor));
    }

    function changeSpread(direction) {
      if (isTurning) return;
      if (spreadIndex < 0) {
        if (direction < 0) return;
        openBook();
        return;
      }
      const target = direction > 0
        ? (spreadIndex + 1) % pages.length
        : spreadIndex - 1;
      if (target < 0) return;

      window.clearTimeout(flipTimer);
      isTurning = true;
      prevButton.disabled = true;
      nextButton.disabled = true;
      turningSheet.hidden = false;

      if (direction > 0) {
        turningSheet.className = "turning-sheet turn-forward";
        turnFront.innerHTML = pageMarkup(spreadIndex, "right");
        turnBack.innerHTML = pageMarkup(target, "left");
        rightPage.innerHTML = pageMarkup(target, "right");
      } else {
        turningSheet.className = "turning-sheet turn-backward";
        turnFront.innerHTML = pageMarkup(spreadIndex, "left");
        turnBack.innerHTML = pageMarkup(target, "right");
        leftPage.innerHTML = pageMarkup(target, "left");
      }

      const finishTurn = (event) => {
        if (event.target !== turningSheet) return;
        turningSheet.removeEventListener("animationend", finishTurn);
        spreadIndex = target;
        if (direction > 0) {
          leftPage.innerHTML = pageMarkup(target, "left");
        } else {
          rightPage.innerHTML = pageMarkup(target, "right");
        }
        updateNavigation();
        turningSheet.hidden = true;
        turningSheet.className = "turning-sheet";
        isTurning = false;
        scheduleFlip();
      };
      turningSheet.addEventListener("animationend", finishTurn);
    }

    function openBook() {
      if (spreadIndex >= 0) return;
      spreadIndex = 0;
      book.classList.add("is-open");
      renderSpread();
      scheduleFlip();
    }

    cover.addEventListener("click", openBook);
    prevButton.addEventListener("click", () => changeSpread(-1));
    nextButton.addEventListener("click", () => changeSpread(1));
    leftPage.addEventListener("click", () => changeSpread(-1));
    rightPage.addEventListener("click", () => changeSpread(1));

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") changeSpread(1);
      if (event.key === "ArrowLeft") changeSpread(-1);
      if (event.key === "Escape") settingsPanel.classList.remove("is-visible");
      if (event.key === "Escape") settingsToggle.setAttribute("aria-expanded", "false");
    });

    settingsToggle.addEventListener("click", () => {
      const isVisible = settingsPanel.classList.toggle("is-visible");
      settingsToggle.setAttribute("aria-expanded", String(isVisible));
    });
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".settings-wrap")) {
        settingsPanel.classList.remove("is-visible");
        settingsToggle.setAttribute("aria-expanded", "false");
      }
    });

    interval.addEventListener("input", () => {
      document.getElementById("intervalValue").textContent = `${interval.value} сек`;
      scheduleFlip();
    });
    randomness.addEventListener("input", () => {
      document.getElementById("randomnessValue").textContent = `${randomness.value}%`;
      scheduleFlip();
    });
    autoFlip.addEventListener("change", () => {
      settingNote.textContent = autoFlip.checked
        ? "Автоперелистывание включено."
        : "Автоперелистывание выключено.";
      scheduleFlip();
    });
  </script>
</body>
</html>
